<!DOCTYPE html>
<html lang="zh-Hant" data-theme="ocean">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1677d2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>BrainPlay 益智遊戲樂園 v2</title>
  <style>
    :root {
      --bg:#f4f9ff; --panel:#ffffff; --panel-2:#eef7ff; --text:#183047; --muted:#687b8c;
      --primary:#1677d2; --primary-2:#55a8f2; --accent:#ffb02e; --success:#1e9f68; --danger:#dc4b5d;
      --line:#dbe8f2; --shadow:0 18px 50px rgba(26,70,106,.13); --soft-shadow:0 9px 24px rgba(26,70,106,.09);
      --hero-text:#fff; --radius:22px;
    }
    html[data-theme="forest"] { --bg:#f2f9f4; --panel-2:#e5f5e9; --text:#183a2c; --muted:#637a6d; --primary:#218c5a; --primary-2:#59bb83; --accent:#f2ad36; --line:#d6e9dc; --shadow:0 18px 50px rgba(30,93,62,.13); --soft-shadow:0 9px 24px rgba(30,93,62,.09); }
    html[data-theme="sunset"] { --bg:#fff8f1; --panel-2:#fff0df; --text:#4a2e1f; --muted:#806d61; --primary:#e86f2d; --primary-2:#f5a34e; --accent:#168ca6; --line:#f0dfd0; --shadow:0 18px 50px rgba(137,67,28,.13); --soft-shadow:0 9px 24px rgba(137,67,28,.09); }
    html[data-theme="rose"] { --bg:#fff6f7; --panel-2:#ffe9ed; --text:#4a2730; --muted:#80656c; --primary:#d94f6d; --primary-2:#ef8ba0; --accent:#e2a62c; --line:#f0dbe0; --shadow:0 18px 50px rgba(130,44,63,.13); --soft-shadow:0 9px 24px rgba(130,44,63,.09); }
    html[data-theme="midnight"] { --bg:#101b28; --panel:#182738; --panel-2:#22364a; --text:#f3f8fc; --muted:#aab9c7; --primary:#2d9ee8; --primary-2:#6cc4f3; --accent:#ffc148; --line:#30475c; --shadow:0 18px 50px rgba(0,0,0,.3); --soft-shadow:0 9px 24px rgba(0,0,0,.22); --hero-text:#fff; }

    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0; min-height:100vh; min-height:100dvh; color:var(--text); background:
      radial-gradient(circle at 8% 0%, color-mix(in srgb, var(--primary) 15%, transparent), transparent 28%),
      radial-gradient(circle at 100% 12%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 25%), var(--bg);
      font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC",system-ui,-apple-system,sans-serif;
      overscroll-behavior-y:none;
    }
    button, select, input { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid color-mix(in srgb, var(--primary) 35%, transparent); outline-offset:2px; }
    .app-shell { width:min(1180px,calc(100% - 28px)); margin:auto; padding:calc(16px + env(safe-area-inset-top)) 0 calc(42px + env(safe-area-inset-bottom)); }

    .topbar { position:sticky; top:max(8px,env(safe-area-inset-top)); z-index:30; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 16px; border:1px solid color-mix(in srgb,var(--line) 85%,transparent); border-radius:22px; background:color-mix(in srgb,var(--panel) 92%,transparent); backdrop-filter:blur(14px); box-shadow:var(--soft-shadow); }
    .brand { display:flex; align-items:center; gap:11px; min-width:0; }
    .brand-mark { width:46px; height:46px; flex:0 0 auto; display:grid; place-items:center; border-radius:15px; color:#fff; background:linear-gradient(145deg,var(--primary),var(--primary-2)); box-shadow:0 9px 20px color-mix(in srgb,var(--primary) 30%,transparent); }
    .brand-mark svg { width:28px; height:28px; }
    .brand h1 { margin:0; font-size:clamp(20px,2.7vw,27px); line-height:1; white-space:nowrap; }
    .brand p { margin:5px 0 0; color:var(--muted); font-size:12px; white-space:nowrap; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .pill,.icon-btn,.compact-select { min-height:44px; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:13px; }
    .pill { display:inline-flex; align-items:center; gap:7px; padding:0 12px; font-weight:800; }
    .icon-btn { width:44px; padding:0; display:grid; place-items:center; font-size:19px; }
    .compact-select { max-width:120px; padding:0 10px; font-weight:750; }

    .hero { display:grid; grid-template-columns:1.45fr .82fr; gap:18px; margin-top:22px; }
    .hero-card,.stats-card { border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .hero-card { min-height:260px; position:relative; isolation:isolate; padding:34px; color:var(--hero-text); background:linear-gradient(135deg,var(--primary),var(--primary-2)); }
    .hero-card::before,.hero-card::after { content:""; position:absolute; z-index:-1; border-radius:50%; background:rgba(255,255,255,.12); }
    .hero-card::before { width:210px; height:210px; right:-45px; top:-85px; }
    .hero-card::after { width:300px; height:300px; right:90px; bottom:-240px; }
    .hero-card h2 { max-width:720px; margin:0 0 11px; font-size:clamp(30px,5vw,53px); line-height:1.08; }
    .hero-card p { max-width:700px; margin:0; line-height:1.7; color:rgba(255,255,255,.9); }
    .hero-card .primary-btn { margin-top:20px; background:#fff; color:var(--primary); box-shadow:none; }
    .stats-card { padding:20px; background:var(--panel); border:1px solid var(--line); }
    .stats-card h3 { margin:0 0 15px; }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .stat { min-height:98px; padding:14px; border:1px solid var(--line); border-radius:17px; background:var(--panel-2); }
    .stat span { font-size:12px; color:var(--muted); }
    .stat strong { display:block; margin-top:8px; font-size:25px; }

    .section-title { display:flex; justify-content:space-between; align-items:end; margin:32px 4px 15px; gap:12px; }
    .section-title h2 { margin:0; font-size:25px; }
    .section-title p { margin:5px 0 0; color:var(--muted); }
    .game-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .game-card { display:flex; flex-direction:column; min-height:245px; padding:19px; border:1px solid var(--line); border-radius:21px; background:var(--panel); box-shadow:var(--soft-shadow); transition:transform .18s,box-shadow .18s; }
    .game-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
    .game-icon { width:58px; height:58px; display:grid; place-items:center; border-radius:17px; margin-bottom:16px; color:var(--primary); background:var(--panel-2); }
    .game-icon svg { width:34px; height:34px; }
    .game-card h3 { margin:0 0 8px; font-size:20px; }
    .game-card p { flex:1; margin:0 0 17px; color:var(--muted); line-height:1.55; }
    .game-meta { display:flex; justify-content:space-between; align-items:center; gap:9px; }
    .tag { padding:6px 9px; border-radius:999px; color:var(--primary); background:var(--panel-2); font-size:12px; font-weight:750; }

    .primary-btn,.secondary-btn,.danger-btn { min-height:46px; border-radius:13px; padding:0 17px; border:0; display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:850; touch-action:manipulation; }
    .primary-btn { color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-2)); box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 25%,transparent); }
    .secondary-btn { color:var(--text); background:var(--panel); border:1px solid var(--line); }
    .danger-btn { color:#fff; background:var(--danger); }
    button:disabled { opacity:.5; cursor:not-allowed; }

    .honor-strip { display:flex; flex-wrap:wrap; gap:10px; padding:15px; border:1px solid var(--line); border-radius:19px; background:var(--panel); box-shadow:var(--soft-shadow); }
    .honor-item { display:flex; align-items:center; gap:8px; min-height:42px; padding:7px 11px; border-radius:13px; background:var(--panel-2); color:var(--muted); font-size:13px; }
    .honor-item.unlocked { color:var(--text); font-weight:800; }

    .game-screen { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)); background:rgba(10,25,39,.58); backdrop-filter:blur(10px); }
    .game-screen.open { display:flex; }
    .game-panel { width:min(940px,100%); max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px); overflow:auto; overscroll-behavior:contain; border:1px solid var(--line); border-radius:25px; background:var(--bg); box-shadow:0 25px 90px rgba(0,0,0,.3); }
    .game-header { position:sticky; top:0; z-index:8; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--panel) 94%,transparent); backdrop-filter:blur(14px); }
    .game-title-wrap { display:flex; align-items:center; gap:11px; min-width:0; }
    .game-title-wrap .brand-mark { width:43px; height:43px; }
    .game-title-wrap h2 { margin:0; font-size:21px; }
    .game-title-wrap small { display:block; margin-top:3px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .game-body { padding:18px; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:12px; margin-bottom:16px; border:1px solid var(--line); border-radius:17px; background:var(--panel); }
    .toolbar-group { display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
    .toolbar label { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; font-weight:750; }
    select { min-height:42px; border:1px solid var(--line); border-radius:11px; padding:0 11px; color:var(--text); background:var(--panel); font-size:16px; }
    .mini-stat { min-width:76px; padding:6px 9px; text-align:center; border-radius:11px; background:var(--panel-2); }
    .mini-stat span { display:block; color:var(--muted); font-size:10px; }
    .mini-stat strong { display:block; margin-top:2px; font-size:16px; }
    .message-box { min-height:30px; margin:8px 0 13px; text-align:center; color:var(--muted); font-weight:800; }
    .center-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:16px; }

    .memory-board { display:grid; gap:9px; width:min(680px,100%); margin:auto; }
    .memory-card { aspect-ratio:1; min-width:0; padding:0; border:0; background:transparent; perspective:700px; }
    .memory-inner { position:relative; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; }
    .memory-card.flipped .memory-inner,.memory-card.matched .memory-inner { transform:rotateY(180deg); }
    .memory-face { position:absolute; inset:0; display:grid; place-items:center; border-radius:14px; backface-visibility:hidden; box-shadow:var(--soft-shadow); }
    .memory-front { color:#fff; background:linear-gradient(145deg,var(--primary),var(--primary-2)); font-size:clamp(20px,5vw,30px); font-weight:900; }
    .memory-back { transform:rotateY(180deg); border:2px solid var(--line); background:var(--panel); }
    .memory-back svg { width:64%; height:64%; }
    .memory-card.matched .memory-back { border-color:var(--success); background:color-mix(in srgb,var(--success) 10%,var(--panel)); }

    .sequence-stage { text-align:center; }
    .sequence-display { min-height:122px; display:grid; place-items:center; margin:6px 0 15px; }
    .flash-token { width:112px; height:112px; display:grid; place-items:center; border:3px solid var(--line); border-radius:27px; background:var(--panel); box-shadow:var(--shadow); font-size:48px; font-weight:950; transition:.14s; }
    .flash-token svg { width:62px; height:62px; }
    .flash-token.active { transform:scale(1.07); border-color:var(--primary); }
    .sequence-options { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:min(650px,100%); margin:auto; }
    .seq-btn { min-height:76px; border:2px solid var(--line); border-radius:16px; background:var(--panel); color:var(--text); font-size:27px; font-weight:900; box-shadow:var(--soft-shadow); }
    .seq-btn svg { width:42px; height:42px; pointer-events:none; }
    .seq-btn:active { transform:scale(.97); }

    .math-box { max-width:680px; margin:auto; text-align:center; }
    .progress { height:10px; overflow:hidden; margin:12px 0; border-radius:999px; background:var(--panel-2); }
    .progress > div { height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--primary-2)); transition:width .2s; }
    .math-question { padding:18px 8px; font-size:clamp(42px,9vw,74px); font-weight:950; letter-spacing:1px; }
    .answer-display { width:min(310px,100%); min-height:57px; margin:0 auto 11px; display:grid; place-items:center; border:2px solid var(--line); border-radius:14px; background:var(--panel); font-size:27px; font-weight:900; }
    .number-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:min(350px,100%); margin:auto; }
    .key-btn { min-height:51px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text); font-size:20px; font-weight:850; box-shadow:var(--soft-shadow); }
    .key-btn.action { color:#fff; background:var(--primary); border-color:transparent; }
    .key-btn.erase { color:var(--danger); }

    .grid-memory { display:grid; gap:7px; width:min(540px,100%); margin:auto; }
    .grid-cell { aspect-ratio:1; min-width:0; border:1px solid var(--line); border-radius:11px; background:var(--panel-2); transition:.15s; }
    .grid-cell.preview { transform:scale(.94); background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 70%,white)); }
    .grid-cell.selected { background:linear-gradient(145deg,var(--primary),var(--primary-2)); }
    .grid-cell.correct { background:var(--success); }
    .grid-cell.wrong { background:var(--danger); }

    .odd-board { display:grid; gap:7px; width:min(610px,100%); margin:auto; }
    .odd-cell { aspect-ratio:1; min-width:0; display:grid; place-items:center; padding:8px; border:1px solid var(--line); border-radius:11px; background:var(--panel); }
    .odd-cell svg { width:82%; height:82%; pointer-events:none; }
    .odd-cell.reveal { border:3px solid var(--success); background:color-mix(in srgb,var(--success) 10%,var(--panel)); }
    .odd-cell.wrong { border-color:var(--danger); background:color-mix(in srgb,var(--danger) 10%,var(--panel)); }

    .pattern-box { max-width:740px; margin:auto; text-align:center; }
    .pattern-sequence { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:21px 0; }
    .pattern-token { min-width:68px; min-height:68px; display:grid; place-items:center; padding:8px; border:2px solid var(--line); border-radius:16px; background:var(--panel); font-size:25px; font-weight:900; }
    .choice-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .choice-btn { min-height:57px; border:2px solid var(--line); border-radius:13px; background:var(--panel); color:var(--text); font-size:20px; font-weight:850; }

    .report-card { display:none; margin-top:18px; overflow:hidden; border:1px solid var(--line); border-radius:22px; background:var(--panel); box-shadow:var(--shadow); }
    .report-card.show { display:block; }
    .report-hero { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:15px; padding:21px; color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-2)); }
    .report-hero.failed { background:linear-gradient(135deg,#c54455,#e77962); }
    .report-medal { width:70px; height:70px; display:grid; place-items:center; border-radius:50%; background:rgba(255,255,255,.18); font-size:38px; }
    .report-hero h3 { margin:0 0 5px; font-size:27px; }
    .report-hero p { margin:0; color:rgba(255,255,255,.88); }
    .report-grade { min-width:72px; text-align:center; font-size:48px; font-weight:950; }
    .report-body { padding:18px; }
    .report-score-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .report-score { padding:12px 8px; text-align:center; border-radius:14px; background:var(--panel-2); }
    .report-score span { display:block; color:var(--muted); font-size:11px; }
    .report-score strong { display:block; margin-top:5px; font-size:20px; }
    .achievement-box { display:flex; align-items:center; gap:11px; margin-top:13px; padding:13px; border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line)); border-radius:15px; background:color-mix(in srgb,var(--accent) 10%,var(--panel)); }
    .achievement-box .medal { font-size:30px; }
    .skill-bars { display:grid; gap:9px; margin-top:15px; }
    .skill-row { display:grid; grid-template-columns:90px 1fr 42px; align-items:center; gap:9px; font-size:13px; }
    .skill-track { height:9px; overflow:hidden; border-radius:999px; background:var(--panel-2); }
    .skill-fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-2)); }
    .report-note { margin:14px 0 0; padding:12px 13px; border-radius:14px; color:var(--muted); background:var(--panel-2); line-height:1.55; }
    .report-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:16px; }

    .toast { position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:300; max-width:calc(100% - 28px); padding:11px 16px; border-radius:999px; color:#fff; background:#172536; opacity:0; transform:translate(-50%,18px); pointer-events:none; transition:.22s; text-align:center; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .footer { margin-top:30px; text-align:center; color:var(--muted); font-size:12px; }

    @media (max-width:900px) { .hero { grid-template-columns:1fr; } .game-grid { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:640px) {
      .app-shell { width:calc(100% - 16px); padding-top:calc(8px + env(safe-area-inset-top)); }
      .topbar { top:max(5px,env(safe-area-inset-top)); padding:10px; border-radius:17px; }
      .brand-mark { width:41px; height:41px; border-radius:13px; }
      .brand p,.top-actions .pill { display:none; }
      .top-actions { gap:5px; }
      .compact-select { width:88px; max-width:88px; padding:0 5px; font-size:13px; }
      .icon-btn { width:41px; min-height:41px; }
      .hero { margin-top:14px; }
      .hero-card { min-height:235px; padding:24px 20px; }
      .stats-card { padding:15px; }
      .game-grid { grid-template-columns:1fr; gap:12px; }
      .game-card { min-height:205px; }
      .game-screen { padding:0; align-items:stretch; }
      .game-panel { max-height:100vh; max-height:100dvh; border-radius:0; border:0; }
      .game-header { padding:calc(10px + env(safe-area-inset-top)) 12px 10px; }
      .game-body { padding:12px 12px calc(18px + env(safe-area-inset-bottom)); }
      .toolbar { padding:9px; align-items:stretch; }
      .toolbar-group { width:100%; }
      .toolbar-group:last-child { justify-content:space-between; }
      .mini-stat { flex:1; min-width:65px; }
      .sequence-options { grid-template-columns:repeat(2,1fr); }
      .seq-btn { min-height:68px; }
      .choice-grid { grid-template-columns:repeat(2,1fr); }
      .report-hero { grid-template-columns:auto 1fr; padding:16px; }
      .report-grade { grid-column:1/-1; text-align:left; font-size:34px; }
      .report-score-grid { grid-template-columns:repeat(2,1fr); }
      .skill-row { grid-template-columns:75px 1fr 38px; }
      .memory-board { gap:7px; }
      .odd-board { gap:5px; }
      .odd-cell { padding:5px; border-radius:9px; }
      .pattern-token { min-width:56px; min-height:58px; font-size:21px; }
    }
    @media (max-width:390px) {
      .brand h1 { font-size:19px; }
      .compact-select { width:78px; max-width:78px; }
      .hero-card h2 { font-size:29px; }
      .stats-grid { gap:7px; }
      .stat { min-height:90px; padding:11px; }
      .game-header small { max-width:215px; }
      .report-medal { width:58px; height:58px; font-size:31px; }
    }

    @media (max-width:360px) {
      .brand h1 { font-size:18px; }
      .compact-select { width:64px; max-width:64px; }
      .top-actions { gap:3px; }
      .icon-btn { width:38px; min-height:40px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="brandIcon"></div>
        <div><h1>BrainPlay</h1><p data-i18n="brandSub">益智遊戲樂園 · Prototype v2</p></div>
      </div>
      <div class="top-actions">
        <div class="pill">⭐ <strong id="headerStars">0</strong></div>
        <select id="themeSelect" class="compact-select" aria-label="配色">
          <option value="ocean">🌊 Ocean</option><option value="forest">🌿 Forest</option><option value="sunset">🌅 Sunset</option><option value="rose">🌹 Rose</option><option value="midnight">🌙 Night</option>
        </select>
        <button class="icon-btn" id="langBtn" aria-label="English">EN</button>
        <button class="icon-btn" id="soundBtn" aria-label="切換音效">🔊</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-card">
          <h2 data-i18n="heroTitle">玩遊戲，訓練你的大腦！</h2>
          <p data-i18n="heroText">從翻牌記憶、顏色數字順序、數學運算，到觀察力與邏輯規律。每次挑戰結束都會產生成績單、等級與榮譽徽章。</p>

      else if(type===3){const s=rand(1,4),m=rand(2,3);seq=[s];for(let i=1;i<5;i++)seq.push(seq[i-1]*m);answer=seq[4]*m;rule=state.lang==='zh'?`每次乘 ${m}`:`Multiply by ${m}`;}
      else if(type===4){const a=rand(1,6),b=rand(1,7);seq=[a,b];for(let i=2;i<5;i++)seq.push(seq[i-1]+seq[i-2]);answer=seq[4]+seq[3];rule=state.lang==='zh'?'前兩項相加':'Add the previous two terms';}
      else if(type===5){const a=rand(1,8),b=a+rand(2,5);const d1=b-a,d2=rand(1,4);seq=[a,b];for(let i=2;i<5;i++)seq.push(seq[i-1]+(i%2?d1:d2));answer=seq[4]+d1;rule=state.lang==='zh'?`交錯加 ${d1}、${d2}`:`Alternate +${d1}, +${d2}`;}
      else if(type===6){const s=rand(1,6),base=rand(1,3);seq=[s];for(let i=1;i<5;i++)seq.push(seq[i-1]+base*i);answer=seq[4]+base*5;rule=state.lang==='zh'?`依序加 ${base}, ${base*2}, ${base*3}…`:`Add ${base}, ${base*2}, ${base*3}…`;}
      else if(type===7){const s=rand(1,6);seq=[0,1,2,3,4].map(i=>s+i*i);answer=s+25;rule=state.lang==='zh'?'依序加奇數 1、3、5、7、9':'Add odd numbers 1, 3, 5, 7, 9';}
      else{const s=rand(2,5);seq=[0,1,2,3,4].map(i=>s*(i+1)*(i+1));answer=s*36;rule=state.lang==='zh'?`平方數乘 ${s}`:`Square numbers × ${s}`;}
      return {seq,options:uniqueOptions(answer)};
    }
    function next(){
      if(q>=10)return finish();q++;questionLocked=false;const data=generate();$('#patternSequence').innerHTML=data.seq.map(n=>`<div class="pattern-token">${n}</div>`).join('')+'<div class="pattern-token">?</div>';$('#patternChoices').innerHTML=data.options.map(n=>`<button class="choice-btn" data-v="${n}">${n}</button>`).join('');$$('.choice-btn').forEach(b=>b.onclick=()=>choose(Number(b.dataset.v)));$('#patternMsg').textContent=`${t('question')} ${q}/10`;stats();
    }
    function choose(v){if(!active||questionLocked)return;questionLocked=true;if(v===answer){correct++;playSound('good');$('#patternMsg').textContent=`✓ ${t('rule')}: ${rule}`;}else{playSound('bad');$('#patternMsg').textContent=`${t('answerWas')}: ${answer} · ${t('rule')}: ${rule}`;}stats();state.timeout=setTimeout(next,650);}
    function finish(){active=false;clearAsync();$('.pattern-box').style.display='none';const accuracy=correct*10;const speed=Math.max(0,100-seconds/90*100);const score=Math.round(accuracy*.85+speed*.15);finalizeSession({game:'pattern',success:correct>=7,score,time:seconds,reportSelector:'#patternReport',summary:`${correct}/10 · ${accuracy}%`,badgeCondition:correct===10,skills:{[t('logicSkill')]:accuracy,[t('focusSkill')]:Math.max(0,score)},restart:start});}
    function start(){clearAsync();markPlay();q=correct=seconds=0;active=true;$('#patternReport').classList.remove('show');$('.pattern-box').style.display='block';stats();next();state.timer=setInterval(()=>{seconds++;stats();},1000);}
    $('#patternStart').onclick=start;stats();
  }

  $('#brandIcon').innerHTML=ICONS.brain;
  $('#themeSelect').addEventListener('change',e=>{state.theme=e.target.value;storageSet('brainplay_theme',state.theme);applyTheme();toast(t('themeChanged'));});
  $('#langBtn').addEventListener('click',()=>{state.lang=state.lang==='zh'?'en':'zh';storageSet('brainplay_lang',state.lang);applyLanguage();toast(t('languageChanged'));});
  $('#soundBtn').addEventListener('click',()=>{state.sound=!state.sound;storageSet('brainplay_sound',state.sound?'on':'off');updateStatsUI();if(state.sound)playSound('good');});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-open-game]');if(b)openGame(b.dataset.openGame);});
  $('#closeGameBtn').onclick=closeGame;$('#gameScreen').addEventListener('click',e=>{if(e.target.id==='gameScreen')closeGame();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.currentGame)closeGame();});

  applyTheme(); applyLanguage(); updateStatsUI();
})();
</script>
</body>
